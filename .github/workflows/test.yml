name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix scripts/cnc-map-ui
      - run: npm run --prefix scripts/cnc-map-ui typecheck
      - run: npm run build:ui
      - run: git diff --exit-code -- scripts/cnc-map-web/app.bundle.js scripts/cnc-map-web/app.css
      - run: npm test
      - run: npm run test:browser
